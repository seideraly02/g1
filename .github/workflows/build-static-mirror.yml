name: Build static mirror

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build portable static site
        run: npm run build -- --base=./

      - name: Prepare SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Publish build branch
        run: |
          rm -rf /tmp/qadam-site
          mkdir -p /tmp/qadam-site
          cp -R dist/. /tmp/qadam-site/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan static-build
          git rm -rf . || true
          cp -R /tmp/qadam-site/. .
          touch .nojekyll
          git add -A
          git commit -m "build: publish portable static site"
          git push origin static-build --force
