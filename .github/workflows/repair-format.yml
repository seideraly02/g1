name: Repair formatting

on:
  push:
    branches:
      - fix/ci-typescript-peer

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format integration files
        run: npx prettier --write src/services/api/apiDiagnosticRepository.ts src/views/ApiDiagnosticView.vue

      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/api/apiDiagnosticRepository.ts src/views/ApiDiagnosticView.vue
          git diff --cached --quiet && exit 0
          git commit -m "style(frontend): format API integration files"
          git push
