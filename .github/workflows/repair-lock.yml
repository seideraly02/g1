name: Repair lockfile

on:
  push:
    branches:
      - fix/ci-typescript-peer

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Regenerate lockfile with supported TypeScript
        run: npm install --package-lock-only --save-dev --save-exact typescript@6.0.3

      - name: Commit lockfile repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "fix(ci): pin TypeScript to 6.0.3"
          git push
