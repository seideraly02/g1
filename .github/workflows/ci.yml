name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: qadam_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d qadam_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply Netlify Database migrations
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d qadam_test -v ON_ERROR_STOP=1 -f netlify/database/migrations/20260825190000_qadam_api_baseline.sql
          psql -h 127.0.0.1 -U postgres -d qadam_test -v ON_ERROR_STOP=1 -f netlify/database/migrations/20260825223000_admin_mvp.sql

      - name: Audit dependencies
        run: npm run audit

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Check types
        run: npm run type-check

      - name: Run tests
        run: npm test
        env:
          QADAM_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/qadam_test

      - name: Check Netlify Functions syntax
        run: npm run check:functions

      - name: Build production frontend and Function bundle
        run: npm run build
        env:
          VITE_API_BASE_URL: /api
