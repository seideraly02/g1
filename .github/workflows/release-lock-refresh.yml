name: Release lock refresh

on:
  push:
    branches:
      - release/production-readiness
    paths:
      - '.github/workflows/release-lock-refresh.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/production-readiness
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm audit fix --package-lock-only
      - run: npm audit --audit-level=high
      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix(release): refresh vulnerable npm lock entry"
          git push origin HEAD:release/production-readiness
