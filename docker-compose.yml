services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: qadam_ent
      POSTGRES_USER: qadam
      POSTGRES_PASSWORD: qadam
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - qadam_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U qadam -d qadam_ent']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./server
    environment:
      PORT: 3000
      DATABASE_URL: jdbc:postgresql://postgres:5432/qadam_ent
      DATABASE_USER: qadam
      DATABASE_PASSWORD: qadam
      FRONTEND_ORIGINS: http://localhost:5173,http://localhost:4173
      AUTH_MODE: development
      DEVELOPMENT_OTP_CODE: '111111'
      TRUSTED_PROXY_SECRET: ''
      SECURITY_PEPPER: local-development-pepper-change-before-production
      SESSION_COOKIE_SECURE: 'false'
      SESSION_COOKIE_SAME_SITE: Lax
      SWAGGER_ENABLED: 'true'
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: node:22.23.1-alpine
    working_dir: /workspace
    command: sh -c "npm ci && npm run dev"
    environment:
      VITE_API_BASE_URL: http://localhost:3000
      VITE_REQUIRE_AUTHENTICATION: 'true'
      VITE_AUTH_DEV_OTP_HINT: 'true'
      VITE_AUTH_DEV_OTP_CODE: '111111'
    ports:
      - '4173:4173'
    volumes:
      - .:/workspace
      - qadam_node_modules:/workspace/node_modules
    depends_on:
      - api

volumes:
  qadam_postgres:
  qadam_node_modules:
