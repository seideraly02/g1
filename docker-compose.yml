services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: qadam_ent
      POSTGRES_USER: qadam
      POSTGRES_PASSWORD: qadam
    ports:
      - '5432:5432'
    volumes:
      - qadam_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U qadam -d qadam_ent']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  qadam_postgres:
